# OpenCCU Snapshot build
# yamllint disable rule:truthy
---
name: Snapshot Build

# The nightly snapshot is meant to be started by an external scheduler,
# because GitHub delays scheduled runs by several hours. It calls the
# workflow_dispatch API with only_if_changes=true, e.g. with a fine-grained
# token limited to this repository and "Actions: write":
#
#   curl -fsS -X POST \
#     -H "Accept: application/vnd.github+json" \
#     -H "Authorization: Bearer ${TOKEN}" \
#     https://api.github.com/repos/OpenCCU/OpenCCU/actions/workflows/snapshot.yml/dispatches \
#     -d '{"ref":"master","inputs":{"only_if_changes":"true"}}'
#
# The schedule below stays as a fallback. Runs are serialized, and a run
# finds no changes if the commit it was started for has already been built
# as a snapshot, so the fallback does not build the same commit twice.

on:
  schedule:
    - cron: '17 0 * * *'  # run at 00:17 UTC (off the full hour to reduce schedule delays)
  workflow_dispatch:
    inputs:
      test_workflow:
        description: 'Test workflow (dry-run)?'
        required: true
        type: 'boolean'
        default: 'false'
      platforms:
        description: 'List of platforms to build (comma seperated, e.g. "rpi3","rpi4")'
        required: true
        default: 'all'
        type: string
      only_if_changes:
        description: 'Only build if there are new commits since the last snapshot (like the scheduled run)?'
        required: true
        type: 'boolean'
        default: 'false'

# default read-only permission
permissions:
  contents: read

# never run two snapshot builds at the same time: a run started while
# another one is in progress waits for it (and then usually finds no
# changes, see repo-check)
concurrency:
  group: snapshot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repo-check:
    name: Check for Changes
    runs-on: ubuntu-24.04
    steps:
      # check out the current branch tip and not the commit this run was
      # started for, so that a snapshot bump pushed by a run this one had
      # to wait for is seen
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - id: commit-check
        run: |
          # last snapshot bump on the branch tip; its subject ends with the
          # short hash of the commit that snapshot was built from
          # ("snapshot bump [<version>-<sha7>]")
          BUMP=$(git --no-pager log --no-merges --grep='snapshot bump \[' --pretty='tformat:%H' -1 HEAD)
          BASE=
          if [ -n "${BUMP}" ]; then
            BUILT=$(git --no-pager log -1 --pretty='tformat:%s' "${BUMP}" | sed -n 's/^snapshot bump \[.*-\([0-9a-f]\{7,\}\)\]$/\1/p')
            # if that commit cannot be resolved, leave BASE empty and build: the
            # bump commit itself may contain commits that were not built
            BASE=$(git rev-parse -q --verify "${BUILT:-none}^{commit}" || true)
          fi
          # count the commits of this run's commit that are not part of the
          # last snapshot (commits merged while that snapshot was built count)
          COUNT=$(git --no-pager log --no-merges --pretty='tformat:%s' ${BASE:+$BASE..}"${GITHUB_SHA}" | grep -v -e '\(snapshot\|release\) bump \[' | wc -l)
          echo "last snapshot built from: ${BASE:-none}, new commits in ${GITHUB_SHA}: ${COUNT}"
          echo "has-commits=$COUNT" >> "$GITHUB_OUTPUT"
    outputs:
      has-commits: ${{ steps.commit-check.outputs.has-commits }}

  changelog_summary:
    permissions:
      contents: read
      pull-requests: read  # mikepenz/release-changelog-builder-action
    name: Generate ChangeLog summary
    if: ${{ github.repository == 'OpenCCU/OpenCCU' && (needs.repo-check.outputs.has-commits > 0 || (github.event_name == 'workflow_dispatch' && github.event.inputs.only_if_changes != 'true')) }}
    runs-on: ubuntu-24.04
    needs: repo-check

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@83f26fea93bc7efcbca2eb5591f5eaaf66b8f206  # v2.1.0

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@b0db9d18b53447ef9f940a46c8f31653c4d9f621  # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configuration: ".github/release-changelog-config.json"
          fromTag: ${{ steps.previoustag.outputs.tag }}
          toTag: ${{ github.sha }}

      - name: Generate ChangeLog summary
        shell: bash
        run: |
          CHANGE_ITEMS=$(cat <<'EOF' | sed -n 's/^[[:space:]]*[-*][[:space:]]\+//p' | sed 's/@Copilot/@jens-maus/g'
          ${{ steps.changelog.outputs.changelog }}
          EOF
          )

          mkdir -p /tmp/changelog-summary

          generate_summary() {
            local lang="$1"
            local outfile="$2"
            local header_link label_changes label_fallback
            case "${lang}" in
              de)
                header_link='<p><b>Zum aktuellen ChangeLog und zur Release-&Uuml;bersicht besuchen Sie:</b> <a href="https://github.com/OpenCCU/OpenCCU/releases">https://github.com/OpenCCU/OpenCCU/releases</a>.</p>'
                label_changes='<p><b>&Auml;nderungen in dieser Version im Vergleich zur vorherigen Version:</b></p>'
                label_fallback='Siehe Release-Seite f&uuml;r den vollst&auml;ndigen Changelog.'
                ;;
              *)
                header_link='<p><b>For recent ChangeLog and Releases overview visit:</b> <a href="https://github.com/OpenCCU/OpenCCU/releases">https://github.com/OpenCCU/OpenCCU/releases</a>.</p>'
                label_changes='<p><b>Changes in this release compared to the previous version:</b></p>'
                label_fallback='See release page for the full changelog.'
                ;;
            esac
            {
              echo "${header_link}"
              echo "${label_changes}"
              echo '<ul>'
              if [[ -n "${CHANGE_ITEMS}" ]]; then
                printf '%s\n' "${CHANGE_ITEMS}" | python3 -c "import html,sys; [print('<li>' + html.escape(line.strip(), quote=True).encode('ascii', 'xmlcharrefreplace').decode('ascii') + '</li>') for line in sys.stdin if line.strip()]"
              else
                echo "<li>${label_fallback}</li>"
              fi
              echo '</ul>'
              echo '<hr/>'
            } >"${outfile}"
          }

          generate_summary en /tmp/changelog-summary/changelog-summary.en.html
          generate_summary de /tmp/changelog-summary/changelog-summary.de.html

      - name: Upload ChangeLog summary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: /tmp/changelog-summary/
          name: changelog-summary

  build:
    permissions:
      contents: write      # actions/upload-artifact
      id-token: write      # actions/attest-build-provenance
      attestations: write  # actions/attest-build-provenance
    name: Snapshot build [${{ matrix.platform }}]
    if: ${{ github.repository == 'OpenCCU/OpenCCU' && (needs.repo-check.outputs.has-commits > 0 || (github.event_name == 'workflow_dispatch' && github.event.inputs.only_if_changes != 'true')) }}
    runs-on: self-hosted
    needs: [repo-check, changelog_summary]
    timeout-minutes: 300
    outputs:
      build_datetime: ${{ steps.env.outputs.build_datetime }}
      build_version: ${{ steps.env.outputs.build_version }}

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(format('[{0}]', (github.event.inputs.platforms == '' || github.event.inputs.platforms == 'all') && '"rpi3","rpi4","rpi5","odroid-c2","odroid-c4","odroid-n2","tinkerboard2","ova","oci_amd64","oci_arm64","generic-x86_64","generic-aarch64","lxc_amd64","lxc_arm64"' || github.event.inputs.platforms)) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Dependencies
        run: |
          if ! dpkg-query -l wget bc cpio rsync zip python3 file >/dev/null 2>&1; then
            apt update
            apt install -y --no-install-recommends wget bc cpio rsync zip python3 file
          fi
          if ! getent group | grep -q ^builder:; then groupadd -g 48 builder; fi
          if ! getent passwd | grep -q ^builder:; then useradd -m -u 1003 -g 48 -G sudo builder; fi
          if ! grep -q ^builder /etc/sudoers; then echo "builder ALL=(ALL:ALL) NOPASSWD: ALL" >>/etc/sudoers; fi
          chown -R builder:builder /home/builder

      - name: Setup Environment
        id: env
        run: |
          echo "DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "OCCU_VERSION=$(grep 'OPENCCU_BASE_COMPAT_VERSION =' buildroot-external/package/openccu-base/openccu-base.mk | cut -d' ' -f3)" >> $GITHUB_ENV
          echo "VERSION=$(grep 'OPENCCU_BASE_COMPAT_VERSION =' buildroot-external/package/openccu-base/openccu-base.mk | cut -d' ' -f3).$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "GITHUB_SHA7=$(echo ${GITHUB_SHA::7})" >> $GITHUB_ENV
          if [[ "${{ github.event.inputs.test_workflow }}" == "true" ]]; then
            echo "FAKE_BUILD=true" >> $GITHUB_ENV
          else
            echo "FAKE_BUILD=" >> $GITHUB_ENV
          fi
          JLEVEL=0
          if [[ -f /sys/fs/cgroup/cpu.max ]]; then # cgroups v2
            CPU_QUOTA=$(cut -d ' ' -f1 /sys/fs/cgroup/cpu.max)
            if [[ "${CPU_QUOTA}" != "max" ]]; then
              CPU_PERIOD=$(cut -d ' ' -f2 /sys/fs/cgroup/cpu.max)
              JLEVEL=$((CPU_QUOTA / CPU_PERIOD + 1))
            fi
          elif [[ -f /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]]; then # cgroups v1
            CPU_QUOTA=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)
            if [[ "${CPU_QUOTA}" != "-1" ]]; then
              CPU_PERIOD=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)
              JLEVEL=$((CPU_QUOTA / CPU_PERIOD + 1))
            fi
          fi
          echo "JLEVEL=${JLEVEL}" >> $GITHUB_ENV
          echo "build_datetime=$(date -u +'%FT%T.%3NZ')" >> $GITHUB_OUTPUT
          echo "build_version=$(grep 'OPENCCU_BASE_COMPAT_VERSION =' buildroot-external/package/openccu-base/openccu-base.mk | cut -d' ' -f3).$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Switch to experimental EULA files
        run: |
          mv -f release/updatepkg/${{ matrix.platform }}/EULA.de_nightly release/updatepkg/${{ matrix.platform }}/EULA.de
          mv -f release/updatepkg/${{ matrix.platform }}/EULA.en_nightly release/updatepkg/${{ matrix.platform }}/EULA.en

      - name: Download ChangeLog summary artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: changelog-summary
          path: /tmp/changelog-summary

      - name: Inject ChangeLog summary into EULA files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          summary_dir = Path("/tmp/changelog-summary")
          begin_marker = b"<!-- OPENCCU_CHANGELOG_BEGIN -->"
          end_marker   = b"<!-- OPENCCU_CHANGELOG_END -->"

          def get_fragment(eula_path: Path) -> bytes:
              """Return the locale-appropriate summary fragment, falling back to English."""
              # EULA.de, EULA.de_nightly → locale "de"; EULA.en, EULA.en_nightly → locale "en"
              suffix = eula_path.name.split(".", 1)[1] if "." in eula_path.name else "en"
              locale = suffix.split("_")[0]
              locale_file = summary_dir / f"changelog-summary.{locale}.html"
              if locale_file.exists():
                  return locale_file.read_bytes()
              # Fallback to English
              return (summary_dir / "changelog-summary.en.html").read_bytes()

          for eula in Path("release/updatepkg").glob("*/EULA.*"):
            content = eula.read_bytes()
            fragment = get_fragment(eula)
            if begin_marker in content and end_marker in content:
              # Replace only the content between the existing markers, in-place.
              start = content.index(begin_marker) + len(begin_marker)
              end   = content.index(end_marker)
              content = content[:start] + b"\n" + fragment + b"\n" + content[end:]
              eula.write_bytes(content)
            else:
              # Fallback for files that don't yet carry the markers.
              marker = b"</body>"
              if marker not in content:
                raise RuntimeError(
                  f"Could not find OPENCCU_CHANGELOG markers or </body> in {eula}"
                )
              section = begin_marker + b"\n" + fragment + b"\n" + end_marker
              eula.write_bytes(content.replace(marker, section + b"\n" + marker, 1))
          PY

      # - name: remote debug tmate session
      #   uses: mxschmitt/action-tmate@v1
      #   if: matrix.platform == 'ova'

      # major build step
      - name: Build
        timeout-minutes: 300
        shell: bash
        run: |
          rm -rf release/OpenCCU-* buildroot-????.*
          sudo chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -H -E -u builder nice -n 19 make DATE=${{ env.DATE }} BR2_DL_DIR=/mnt/download BR2_CCACHE_DIR=/mnt/ccache/${{ matrix.platform }} BR2_JLEVEL=${{ env.JLEVEL }} PRODUCT=${{ matrix.platform }} clean-all release
          mv release/OpenCCU-${{ env.VERSION }}-${{ matrix.platform }}.mf release/OpenCCU-${{ env.VERSION }}-${{ env.GITHUB_SHA7 }}-${{ matrix.platform }}.mf

      # check linux kernel config consistency
      - name: Check Linux Kconfig
        if: |
          github.event.inputs.test_workflow != 'true' &&
          !startsWith(matrix.platform, 'oci_') &&
          !startsWith(matrix.platform, 'lxc_')
        run: |
          sudo -H -E -u builder nice -n 19 make DATE=${{ env.DATE }} BR2_DL_DIR=/mnt/download BR2_CCACHE_DIR=/mnt/ccache/${{ matrix.platform }} BR2_JLEVEL=${{ env.JLEVEL }} PRODUCT=${{ matrix.platform }} linux-check-dotconfig

      # cleanup
      - name: Cleanup
        run: |
          sudo -H -E -u builder make clean-all
          rm -rf release/*.img* buildroot-????.*

      #######################
      # nightly snapshot uploads
      - name: Upload build snapshot [rpi*, odroid-c2, odroid-c4, odroid-n2, tinkerboard2, ova, generic-*]
        if: |
          github.repository_owner == 'OpenCCU' &&
          !startsWith(matrix.platform, 'oci_') &&
          !startsWith(matrix.platform, 'lxc_')
        uses: WebFreak001/deploy-nightly@46ecbabd7fad70d3e7d2c97fe8cd54e7a52e215b  # v3.2.0
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          upload_url: https://uploads.github.com/repos/OpenCCU/OpenCCU/releases/22744592/assets{?name,label}
          release_id: 22744592
          asset_path: release/OpenCCU-${{ env.VERSION }}-${{ matrix.platform }}.zip
          asset_name: OpenCCU-${{ env.OCCU_VERSION }}.$$-${{ matrix.platform }}.zip
          asset_content_type: application/zip
          max_releases: 1

      - name: Upload build snapshot checksum [rpi*, odroid-c2, odroid-c4, odroid-n2, tinkerboard2, ova, generic-*]
        if: |
          github.repository_owner == 'OpenCCU' &&
          !startsWith(matrix.platform, 'oci_') &&
          !startsWith(matrix.platform, 'lxc_')
        uses: WebFreak001/deploy-nightly@46ecbabd7fad70d3e7d2c97fe8cd54e7a52e215b  # v3.2.0
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          upload_url: https://uploads.github.com/repos/OpenCCU/OpenCCU/releases/22744592/assets{?name,label}
          release_id: 22744592
          asset_path: release/OpenCCU-${{ env.VERSION }}-${{ matrix.platform }}.zip.sha256
          asset_name: OpenCCU-${{ env.OCCU_VERSION }}.$$-${{ matrix.platform }}.zip.sha256
          asset_content_type: text/plain
          max_releases: 1

      - name: Upload build snapshot [ccu3]
        if: |
          github.repository_owner == 'OpenCCU' &&
          matrix.platform == 'rpi3'
        uses: WebFreak001/deploy-nightly@46ecbabd7fad70d3e7d2c97fe8cd54e7a52e215b  # v3.2.0
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          upload_url: https://uploads.github.com/repos/OpenCCU/OpenCCU/releases/22744592/assets{?name,label}
          release_id: 22744592
          asset_path: release/OpenCCU-${{ env.VERSION }}-ccu3.tgz
          asset_name: OpenCCU-${{ env.OCCU_VERSION }}.$$-ccu3.tgz
          asset_content_type: application/gzip
          max_releases: 1

      - name: Upload build snapshot checksum [ccu3]
        if: |
          github.repository_owner == 'OpenCCU' &&
          matrix.platform == 'rpi3'
        uses: WebFreak001/deploy-nightly@46ecbabd7fad70d3e7d2c97fe8cd54e7a52e215b  # v3.2.0
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          upload_url: https://uploads.github.com/repos/OpenCCU/OpenCCU/releases/22744592/assets{?name,label}
          release_id: 22744592
          asset_path: release/OpenCCU-${{ env.VERSION }}-ccu3.tgz.sha256
          asset_name: OpenCCU-${{ env.OCCU_VERSION }}.$$-ccu3.tgz.sha256
          asset_content_type: text/plain
          max_releases: 1

      - name: Upload build snapshot [ova]
        if: |
          github.repository_owner == 'OpenCCU' &&
          matrix.platform == 'ova'
        uses: WebFreak001/deploy-nightly@46ecbabd7fad70d3e7d2c97fe8cd54e7a52e215b  # v3.2.0
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          upload_url: https://uploads.github.com/repos/OpenCCU/OpenCCU/releases/22744592/assets{?name,label}
          release_id: 22744592
          asset_path: release/OpenCCU-${{ env.VERSION }}.ova
          asset_name: OpenCCU-${{ env.OCCU_VERSION }}.$$.ova
          asset_content_type: application/gzip
          max_releases: 1

      - name: Upload build snapshot checksum [ova]
        if: |
          github.repository_owner == 'OpenCCU' &&
          matrix.platform == 'ova'
        uses: WebFreak001/deploy-nightly@46ecbabd7fad70d3e7d2c97fe8cd54e7a52e215b  # v3.2.0
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          upload_url: https://uploads.github.com/repos/OpenCCU/OpenCCU/releases/22744592/assets{?name,label}
          release_id: 22744592
          asset_path: release/OpenCCU-${{ env.VERSION }}.ova.sha256
          asset_name: OpenCCU-${{ env.OCCU_VERSION }}.$$.ova.sha256
          asset_content_type: text/plain
          max_releases: 1

      - name: Upload build snapshot [oci]
        if: |
          github.repository_owner == 'OpenCCU' &&
          startsWith(matrix.platform, 'oci_')
        uses: WebFreak001/deploy-nightly@46ecbabd7fad70d3e7d2c97fe8cd54e7a52e215b  # v3.2.0
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          upload_url: https://uploads.github.com/repos/OpenCCU/OpenCCU/releases/22744592/assets{?name,label}
          release_id: 22744592
          asset_path: release/OpenCCU-${{ env.VERSION }}-${{ matrix.platform }}.tgz
          asset_name: OpenCCU-${{ env.OCCU_VERSION }}.$$-${{ matrix.platform }}.tgz
          asset_content_type: application/gzip
          max_releases: 1

      - name: Upload build snapshot checksum [oci]
        if: |
          github.repository_owner == 'OpenCCU' &&
          startsWith(matrix.platform, 'oci_')
        uses: WebFreak001/deploy-nightly@46ecbabd7fad70d3e7d2c97fe8cd54e7a52e215b  # v3.2.0
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          upload_url: https://uploads.github.com/repos/OpenCCU/OpenCCU/releases/22744592/assets{?name,label}
          release_id: 22744592
          asset_path: release/OpenCCU-${{ env.VERSION }}-${{ matrix.platform }}.tgz.sha256
          asset_name: OpenCCU-${{ env.OCCU_VERSION }}.$$-${{ matrix.platform }}.tgz.sha256
          asset_content_type: text/plain
          max_releases: 1

      - name: Upload build snapshot [lxc]
        if: |
          github.repository_owner == 'OpenCCU' &&
          startsWith(matrix.platform, 'lxc_')
        uses: WebFreak001/deploy-nightly@46ecbabd7fad70d3e7d2c97fe8cd54e7a52e215b  # v3.2.0
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          upload_url: https://uploads.github.com/repos/OpenCCU/OpenCCU/releases/22744592/assets{?name,label}
          release_id: 22744592
          asset_path: release/OpenCCU-${{ env.VERSION }}-${{ matrix.platform }}.tar.xz
          asset_name: OpenCCU-${{ env.OCCU_VERSION }}.$$-${{ matrix.platform }}.tar.xz
          asset_content_type: application/x-xz
          max_releases: 1

      - name: Upload build snapshot checksum [lxc]
        if: |
          github.repository_owner == 'OpenCCU' &&
          startsWith(matrix.platform, 'lxc_')
        uses: WebFreak001/deploy-nightly@46ecbabd7fad70d3e7d2c97fe8cd54e7a52e215b  # v3.2.0
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          upload_url: https://uploads.github.com/repos/OpenCCU/OpenCCU/releases/22744592/assets{?name,label}
          release_id: 22744592
          asset_path: release/OpenCCU-${{ env.VERSION }}-${{ matrix.platform }}.tar.xz.sha256
          asset_name: OpenCCU-${{ env.OCCU_VERSION }}.$$-${{ matrix.platform }}.tar.xz.sha256
          asset_content_type: text/plain
          max_releases: 1

      # WebFreak001/deploy-nightly only removes old assets whose name starts
      # with the same prefix in front of the '$$' placeholder, i.e.
      # 'OpenCCU-<OCCU_VERSION>.'. After an OpenCCU-Base bump (e.g. 3.89.11 ->
      # 3.89.14) the snapshots of the previous version thus no longer match
      # and stay in the release. Once the new ones have been uploaded
      # successfully, remove all older snapshot assets of this platform that
      # belong to a different OpenCCU-Base version.
      - name: Remove outdated snapshot assets of other OpenCCU-Base versions
        if: |
          github.repository_owner == 'OpenCCU'
        shell: python3 {0}
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          GH_REPO: OpenCCU/OpenCCU
          RELEASE_ID: 22744592
          PLATFORM: ${{ matrix.platform }}
        run: |
          import json, os, re, urllib.error, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          release_id = os.environ["RELEASE_ID"]
          platform = os.environ["PLATFORM"]
          occu_version = os.environ["OCCU_VERSION"]

          # archive name suffixes (after the '$$' placeholder) this platform
          # uploads; each archive comes with a '<archive>.sha256' checksum
          if platform.startswith("oci_"):
            archive_suffixes = [f"-{platform}.tgz"]
          elif platform.startswith("lxc_"):
            archive_suffixes = [f"-{platform}.tar.xz"]
          else:
            archive_suffixes = [f"-{platform}.zip"]
            if platform == "rpi3":
              archive_suffixes.append("-ccu3.tgz")
            elif platform == "ova":
              archive_suffixes.append(".ova")
          checksum_suffixes = [s + ".sha256" for s in archive_suffixes]

          # OpenCCU-<x.y.z>.<YYYYMMDD>-<sha><suffix>
          pattern = re.compile(r"^OpenCCU-(\d+(?:\.\d+)*)\.\d{8}-[0-9a-f]+(.+)$")

          def api(method, url):
            req = urllib.request.Request(url, method=method, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
            })
            with urllib.request.urlopen(req) as resp:
              body = resp.read()
              return json.loads(body) if body else None

          assets = []
          page = 1
          while True:
            batch = api("GET", f"https://api.github.com/repos/{repo}/releases/{release_id}/assets?per_page=100&page={page}")
            assets += batch
            if len(batch) < 100:
              break
            page += 1

          by_name = {a["name"]: a for a in assets}
          deleted = set()

          def delete(asset):
            if asset["name"] in deleted:
              return
            print(f"Deleting outdated snapshot asset {asset['name']}")
            try:
              api("DELETE", f"https://api.github.com/repos/{repo}/releases/assets/{asset['id']}")
            except urllib.error.HTTPError as e:
              if e.code != 404:  # 404: already deleted by an overlapping run
                raise
            deleted.add(asset["name"])

          # group the archives of this platform by suffix
          archives = {s: [] for s in archive_suffixes}
          for asset in assets:
            m = pattern.match(asset["name"])
            if m and m.group(2) in archives:
              archives[m.group(2)].append((m.group(1), asset))

          # Archive and checksum always share one decision, based on the
          # archive (which is uploaded before its checksum). Only archives of
          # other versions which are older than the newest archive of the
          # current version are deleted, together with their checksum. If
          # another snapshot run with a different OpenCCU-Base version
          # overlaps with this one, only the older upload gets removed and
          # the newest archive always survives.
          for suffix, entries in archives.items():
            current = [a["created_at"] for v, a in entries if v == occu_version]
            if not current:
              continue
            newest = max(current)  # ISO 8601 UTC timestamps sort lexically
            for version, asset in entries:
              if version == occu_version or asset["created_at"] >= newest:
                continue
              delete(asset)
              checksum = by_name.get(asset["name"] + ".sha256")
              if checksum:
                delete(checksum)

          # A checksum is only ever uploaded after its archive, so a checksum
          # without its archive is left over from an archive an overlapping
          # run has already deleted. Only trust a complete single-page
          # listing here: with several pages, a concurrent deletion can shift
          # an archive onto an already read page and hide it.
          for asset in (assets if page == 1 else []):
            m = pattern.match(asset["name"])
            if m and m.group(2) in checksum_suffixes and asset["name"][:-len(".sha256")] not in by_name:
              delete(asset)

          print(f"Deleted {len(deleted)} outdated snapshot asset(s) for platform {platform}")

      ########################
      # upload build artifacts (oci only)
      - name: Upload build artifact [oci]
        id: upload-oci
        if: |
          startsWith(matrix.platform, 'oci_')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: release/OpenCCU-${{ env.VERSION }}-${{ matrix.platform }}.tgz*
          name: OpenCCU-${{ env.VERSION }}-${{ env.GITHUB_SHA7 }}-${{ matrix.platform }}.tgz
        continue-on-error: true

      - name: Attest artifact provenance [oci]
        if: |
          startsWith(matrix.platform, 'oci_')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-name: OpenCCU-${{ env.VERSION }}-${{ env.GITHUB_SHA7 }}-${{ matrix.platform }}.tgz
          subject-digest: sha256:${{ steps.upload-oci.outputs.artifact-digest }}
        continue-on-error: true

      #######################
      # manifest file artifact upload
      - name: Upload manifest artifact
        id: upload-manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          path: release/OpenCCU-${{ env.VERSION }}-${{ env.GITHUB_SHA7 }}-${{ matrix.platform }}.mf
          name: OpenCCU-${{ env.VERSION }}-${{ env.GITHUB_SHA7 }}-${{ matrix.platform }}.mf

      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-name: OpenCCU-${{ env.VERSION }}-${{ env.GITHUB_SHA7 }}-${{ matrix.platform }}.mf
          subject-digest: sha256:${{ steps.upload-manifest.outputs.artifact-digest }}
        continue-on-error: true

  ##########################################
  # OCI/Docker build and registry push step
  oci-multiarch-build-push:
    permissions:
      packages: write      # docker/build-push-action
      artifact-metadata: write  # docker/build-push-action build record
      id-token: write      # actions/attest-build-provenance
      attestations: write  # actions/attest-build-provenance
      contents: read       # actions/attest-build-provenance
    name: OCI/Docker Build+Push
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request' &&
      ( github.event.inputs.platforms == '' ||
        github.event.inputs.platforms == 'all' ||
        contains(github.event.inputs.platforms, 'oci_'))

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq

      - name: Setup Environment
        run: |
          echo "BUILD_DATETIME=${{ needs.build.outputs.build_datetime }}" >> $GITHUB_ENV
          echo "BUILD_VERSION=${{ needs.build.outputs.build_version }}" >> $GITHUB_ENV
          echo "GIT_REF=$(git symbolic-ref -q --short HEAD || git describe --tags --exact-match)" >> $GITHUB_ENV
          echo "GITHUB_SHA7=$(echo ${GITHUB_SHA::7})" >> $GITHUB_ENV

      # download OCI platform artifacts
      - name: Download all OCI artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: OpenCCU-${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}-oci_*.tgz
          merge-multiple: true

      - name: Extract OCI artifacts
        run: |
          rm -rf oci_build
          mkdir -p oci_build
          cd oci_build || exit 1
          shopt -s nullglob
          for f in ../OpenCCU-${{ env.BUILD_VERSION }}-oci_*.tgz; do
            echo "extracting ${f}..."
            DIR=$(basename "${f}" .tgz)
            mkdir -p "${DIR}"
            tar -C "${DIR}" -xf "${f}"
            LAYER=$(jq -r '.[0].Layers[0]' "${DIR}/manifest.json")
            mv -f "${DIR}/${LAYER}" "./${DIR}.tar"
            rm -rf "${DIR}" "${f}"*
          done

      - name: Build OCI tags
        shell: bash
        run: |
          BASE_TAG="ghcr.io/${GITHUB_REPOSITORY@L}"
          UNIQUE_TAG="${BASE_TAG}:${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}"
          if [[ ${GITHUB_EVENT_NAME} == 'schedule' || ${GITHUB_EVENT_NAME} == 'workflow_dispatch' ]]; then
            BRANCH="${GITHUB_REF##*/}"
            if [[ ${BRANCH} == 'master' ]]; then
              BRANCH_TAG="${BASE_TAG}:snapshot"
            else
              BRANCH_TAG="${BASE_TAG}:snapshot-${BRANCH}"
            fi
          fi
          echo "base_tag=${BASE_TAG}" >> $GITHUB_OUTPUT
          echo "unique_tag=${UNIQUE_TAG}" >> $GITHUB_OUTPUT
          echo "branch_tag=${BRANCH_TAG}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0
        with:
          use: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Extract docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ steps.extract_branch.outputs.base_tag }}
          labels: |
            maintainer=OpenCCU OpenSource Team
            org.opencontainers.image.title=OpenCCU
            org.opencontainers.image.description=Alternative OS for your homematicIP CCU
            org.opencontainers.image.vendor=OpenCCU OpenSource Project
            org.opencontainers.image.authors=OpenCCU OpenSource Team
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.url=https://openccu.de
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/wiki
            org.opencontainers.image.created=${{ env.BUILD_DATETIME }}
            org.opencontainers.image.ref.name=${{ env.GIT_REF }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}
            io.hass.name=OpenCCU
            io.hass.description=HomeMatic/homematicIP CCU central based on OpenCCU
            io.hass.url=https://github.com/${{ github.repository }}/tree/master/home-assistant-addon
            io.hass.version=${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}
            io.hass.type=addon
            io.hass.arch=aarch64|amd64
          annotations: |
            maintainer=OpenCCU OpenSource Team
            org.opencontainers.image.title=OpenCCU
            org.opencontainers.image.description=Alternative OS for your homematicIP CCU
            org.opencontainers.image.vendor=OpenCCU OpenSource Project
            org.opencontainers.image.authors=OpenCCU OpenSource Team
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.url=https://openccu.de
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/wiki
            org.opencontainers.image.created=${{ env.BUILD_DATETIME }}
            org.opencontainers.image.ref.name=${{ env.GIT_REF }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}
            io.hass.name=OpenCCU
            io.hass.description=HomeMatic/homematicIP CCU central based on OpenCCU
            io.hass.url=https://github.com/${{ github.repository }}/tree/master/home-assistant-addon
            io.hass.version=${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}
            io.hass.type=addon
            io.hass.arch=aarch64|amd64
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: docker_build
        with:
          context: oci_build
          file: buildroot-external/board/oci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            tar_prefix=OpenCCU-${{ env.BUILD_VERSION }}-oci_
          labels: |
            ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ steps.extract_branch.outputs.unique_tag }}
            ${{ steps.extract_branch.outputs.branch_tag }}
          annotations: |
            ${{ steps.meta.outputs.annotations }}

      - name: Container image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Attest container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        id: attest
        with:
          subject-name: ${{ steps.extract_branch.outputs.base_tag }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

      - name: Cleanup oci_build dir
        run: |
          rm -rf oci_build

  helm:
    permissions:
      contents: write  # stefanprodan/helm-gh-pages
    name: Build K8s Helm chart
    runs-on: ubuntu-24.04
    needs: [build, oci-multiarch-build-push]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        id: env
        run: |
          echo "GITHUB_SHA7=$(echo ${GITHUB_SHA::7})" >> $GITHUB_ENV

      - name: Publish Helm chart
        uses: stefanprodan/helm-gh-pages@0ad2bb377311d61ac04ad9eb6f252fb68e207260  # v1.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          charts_dir: helm
          chart_version: 0.1  # Latest snapshot
          app_version: ${{ needs.build.outputs.build_version }}-${{ env.GITHUB_SHA7 }}

  ##########################################
  # Publish new version to public
  publish-build:
    permissions:
      contents: write  # github-actions[bot] repo write access
    name: Publish build
    runs-on: ubuntu-24.04
    needs: [build, oci-multiarch-build-push]
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: master
          persist-credentials: true
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Setup Environment
        run: |
          echo "BUILD_VERSION=${{ needs.build.outputs.build_version }}" >> $GITHUB_ENV
          echo "GITHUB_SHA7=$(echo ${GITHUB_SHA::7})" >> $GITHUB_ENV

      - name: Bump HomeAssistant add-on version
        run: |
          VERSION=${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}
          sed -i "s/^\(version:\)\(.*\)/\1 ${VERSION}/" home-assistant-addon-dev/config.yaml

      # download rpi manifest files
      - name: Download rpi3 manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: OpenCCU-${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}-rpi3.mf
      - name: Download rpi4 manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: OpenCCU-${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}-rpi4.mf
      - name: Download rpi5 manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: OpenCCU-${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}-rpi5.mf

      - name: Bump rpi-imager version
        run: |
          release/rpi-imager-update.sh release/rpi-imager-dev.json \
            OpenCCU-${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}-rpi3.mf \
            OpenCCU-${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}-rpi4.mf \
            OpenCCU-${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}-rpi5.mf

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git diff --quiet || git commit -a -m "snapshot bump [${{ env.BUILD_VERSION }}-${{ env.GITHUB_SHA7 }}]"
          git push origin HEAD:master

  cleanup:
    permissions:
      contents: write  # c-hive/gha-remove-artifacts
      actions: write  # c-hive/gha-remove-artifacts
    name: Cleanup artifacts/packages
    runs-on: ubuntu-24.04
    steps:
      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@62c2fbea931baa7dd4a6b73ea5a799984a818f61  # v1.8.0
        with:
          age: '2 months'
          skip-tags: true
          skip-recent: 15
        continue-on-error: true

      - name: Remove old unused container images
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53  # v3.1.0
        with:
          account: user
          token: ${{ secrets.CR_PAT }}
          cut-off: 4w
          image-names: openccu
          image-tags: "*-???????"
          tag-selection: tagged
          keep-n-most-recent: 5
          timestamp-to-use: created_at
          dry-run: true
        continue-on-error: true
