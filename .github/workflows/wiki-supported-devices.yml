# OpenCCU supported devices wiki page update workflow
# yamllint disable rule:truthy
---
name: Wiki Supported Devices

on:
  push:
    branches:
      - master
    paths:
      - 'buildroot-external/package/openccu-base/openccu-base.mk'
      - 'scripts/generate-supported-devices.py'
      - '.github/workflows/wiki-supported-devices.yml'
  schedule:
    - cron: '45 19 * * *'  # daily, after the last HMDeviceFirmware autopublish run
  workflow_dispatch:

concurrency:
  group: wiki-supported-devices-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-wiki:
    name: Update supported devices wiki pages
    if: ${{ github.repository == 'OpenCCU/OpenCCU' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OpenCCU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: openccu
          persist-credentials: false

      - name: Determine OpenCCU-Base version
        id: base
        run: |
          version=$(sed -n 's/^OPENCCU_BASE_VERSION = //p' openccu/buildroot-external/package/openccu-base/openccu-base.mk)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Checkout OpenCCU-Base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: OpenCCU/OpenCCU-Base
          ref: ${{ steps.base.outputs.version }}
          path: openccu-base
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/devicetypes/
            /opt/HMServer/HMIPServer.jar
            /www/config/devdescr/
            /www/config/img/devices/
            /www/webui/js/lang/

      - name: Checkout HMDeviceFirmware
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: OpenCCU/HMDeviceFirmware
          path: hmdevicefirmware
          persist-credentials: false

      # GITHUB_TOKEN needs contents:write to push to the wiki; if that is not
      # sufficient, provide a token with "Contents: Read and write" on this
      # repository as secret WIKI_TOKEN.
      - name: Checkout wiki
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate wiki pages
        run: |
          python3 openccu/scripts/generate-supported-devices.py \
            --base openccu-base \
            --firmware hmdevicefirmware \
            --wiki wiki

      - name: Commit and push wiki pages
        working-directory: wiki
        env:
          BASE_VERSION: ${{ steps.base.outputs.version }}
        run: |
          git add -A
          # the data basis line changes with every run (date, firmware archive
          # commit); only publish when the device lists themselves changed
          if git diff --cached --quiet -I '^\*\*Da'; then
            echo "No changes to the supported devices pages."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update supported devices list" \
            -m "Generated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} from OpenCCU-Base ${BASE_VERSION}."
          git push
